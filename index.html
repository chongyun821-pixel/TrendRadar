<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HORUS</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="preload" href="/fonts/horus-hanwha-r.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body>
  <div id="globe"></div>
  <header class="top">
    <div class="top-left">
      <div class="brand" aria-label="HORUS"><img id="brandLogo" src="/logo-symbol.png" alt="" width="35" height="32" /><span class="wordmark">HORUS</span></div>
      <nav class="view-tabs" aria-label="화면 전환"><button id="mapViewBtn" class="on" type="button" aria-current="page">지도</button><button id="reportViewBtn" type="button">보고서</button><button id="settingsButton" type="button" title="설정 (Ctrl+,)">설정</button></nav>
    </div>
    <nav id="modes" class="modes" aria-label="무기체계"></nav>
    <button id="mapBtn" class="map-btn" type="button" aria-pressed="false">2D 지도</button>
  </header>
  <main id="settingsView" class="settings-view" aria-label="설정" hidden>
    <div class="settings-content">
      <h1>설정</h1>
      <section class="settings-card"><h2>기기 이름</h2><div class="settings-row device-row"><div class="settings-fields"><input id="deviceName" type="text" autocomplete="off" aria-label="기기 이름"><p>원격 클라이언트가 이 컴퓨터의 HORUS 앱을 찾을 때 사용하는 이름입니다.</p></div><button type="button" id="saveDeviceName">저장</button></div><div class="remote-status-row"><span id="remoteStatus" role="status">원격 연결 상태를 확인하고 있습니다.</span><button type="button" id="remoteAction" hidden></button></div><p id="remoteLinkFallback" class="remote-link-fallback" hidden>브라우저가 열리지 않으면 <a target="_blank" rel="noopener"></a> 주소를 여세요.</p></section>
      <section class="settings-card"><h2>API 키</h2><div id="secretFields"></div></section>
    </div>
  </main>
  <div id="legend" class="legend"></div>
  <aside id="hatchRanking" class="hatch-ranking" aria-labelledby="hatchRankingTitle" hidden></aside>
  <div id="dataUpdated" class="data-updated"></div>
  <div id="tip" class="tip"></div>
  <main id="rankingReport" class="ranking-report" aria-label="예상 수주 전망 보고서" hidden></main>
  <section id="chat" class="chat">
    <div class="panel">
      <div id="msgs" class="msgs"></div>
      <div id="chatStatus" class="chat-status" role="status" aria-live="polite"></div>
    </div>
    <div class="composer">
      <div id="picker" class="picker" hidden></div>
      <section id="workspace" class="chat-menu resource-menu" aria-label="대화 자료" hidden>
        <div class="menu-head"><strong>대화 자료</strong><button type="button" class="menu-close" aria-label="대화 자료 닫기">×</button></div>
        <button id="addFiles" type="button" class="add-files">＋ 자료 추가 <span>파일 선택 또는 화면에 끌어 놓기</span></button>
        <div id="uploadStatus" class="menu-caption" role="status" aria-live="polite"></div>
        <div id="workspaceFiles" class="workspace-files"></div>
        <div id="suggest" class="suggest"></div>
      </section>
      <div class="composer-meta"><span id="sessionsButton" title="대화 목록">^</span> <span id="conversationTitle" title="제목 변경">새 대화</span> | <span id="modelLabel" title="모델 변경"></span><span id="attachments" hidden></span></div>
      <form class="bar" autocomplete="off">
      <button id="chatToggle" class="tgl" type="button" aria-label="채팅"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <textarea id="q" rows="1" aria-label="메시지" placeholder="챗봇 메시지 입력"></textarea>
      <input id="fileInput" type="file" multiple hidden />
      <button id="attachButton" type="button" aria-label="대화 자료" title="대화 자료와 파일 추가" aria-controls="workspace" aria-expanded="false">＋<span id="fileCount" class="file-count" hidden></span></button>
      <button id="stopButton" type="button" aria-label="중지" title="응답 생성 중지" hidden><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor"/></svg></button>
      <button class="send" type="submit" aria-label="보내기"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </form>
    </div>
    <div id="dropOverlay" class="drop-overlay" hidden><strong>파일을 놓아 대화에 추가</strong><span>이 대화의 작업 폴더에 업로드합니다</span></div>
  </section>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
