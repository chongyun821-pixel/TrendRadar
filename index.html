<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>무기조달사업예상</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%2305080f' stroke='%234c8dff' stroke-width='3'/><circle cx='20' cy='12' r='4' fill='%23ff453a'/></svg>" />
</head>
<body>
  <div id="globe"></div>
  <header class="top">
    <div class="brand">무기조달사업예상</div>
    <nav id="modes" class="modes"></nav>
    <button id="mapBtn" class="map-btn" type="button">지도 모드</button>
  </header>
  <div id="legend" class="legend"></div>
  <div id="dataUpdated" class="data-updated"></div>
  <div id="tip" class="tip"></div>
  <section id="chat" class="chat">
    <div class="panel">
      <div id="msgs" class="msgs"></div>
      <div id="chatStatus" class="chat-status" role="status" aria-live="polite"></div>
    </div>
    <div class="composer">
      <div id="picker" class="picker" hidden></div>
      <section id="workspace" class="chat-menu resource-menu" aria-label="대화 자료" hidden>
        <div class="menu-head"><strong>대화 자료</strong><button type="button" class="menu-close" aria-label="대화 자료 닫기">×</button></div>
        <button id="addFiles" type="button" class="add-files">＋ 자료 추가 <span>파일 선택 또는 화면에 끌어 놓기</span></button>
        <div id="uploadStatus" class="menu-caption" role="status" aria-live="polite"></div>
        <div id="workspaceFiles" class="workspace-files"></div>
        <div id="suggest" class="suggest"></div>
      </section>
      <div class="composer-meta"><span id="conversationTitle" title="제목 변경">새 대화</span> | <span id="modelLabel" title="모델 변경"></span></div>
      <form class="bar" autocomplete="off">
      <button id="chatToggle" class="tgl" type="button" aria-label="채팅"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <textarea id="q" rows="1" aria-label="메시지" placeholder="챗봇 메시지 입력"></textarea>
      <input id="fileInput" type="file" multiple hidden />
      <button id="attachButton" type="button" aria-label="대화 자료" title="대화 자료 · 파일 추가" aria-controls="workspace" aria-expanded="false">＋<span id="fileCount" class="file-count" hidden></span></button>
      <button id="stopButton" type="button" aria-label="중지" title="응답 생성 중지" hidden><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor"/></svg></button>
      <button class="send" type="submit" aria-label="보내기"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </form>
    </div>
    <div id="dropOverlay" class="drop-overlay" hidden><strong>파일을 놓아 대화에 추가</strong><span>이 대화의 작업 폴더에 업로드합니다</span></div>
  </section>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
