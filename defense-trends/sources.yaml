# 소스 설정. type: rss (기본) | html (selector 필요)
# html 예시:
#  - {name: X, category: company, type: html, url: "https://...", link_selector: "a.news-title", base_url: "https://..."}
settings:
  interval_hours: 3
  timeout_seconds: 25
  user_agent: "Mozilla/5.0 (compatible; DefenseTrendsBot/1.0; +local research tool)"
  max_items_per_source: 100
sources:
  # company
  - {name: Lockheed Martin, category: company, url: "https://news.lockheedmartin.com/news-releases?pagetemplate=rss"}
  - {name: L3Harris, category: company, url: "https://www.l3harris.com/rss.xml"}
  - {name: RTX (Google News), category: company, url: "https://news.google.com/rss/search?hl=en-US&gl=US&ceid=US:en&q=RTX+Raytheon+when:14d"}
  - {name: BAE Systems (Google News), category: company, url: "https://news.google.com/rss/search?hl=en-US&gl=US&ceid=US:en&q=%22BAE+Systems%22+when:14d"}
  - {name: Northrop Grumman (Google News), category: company, url: "https://news.google.com/rss/search?hl=en-US&gl=US&ceid=US:en&q=%22Northrop+Grumman%22+when:14d"}
  - {name: General Dynamics (Google News), category: company, url: "https://news.google.com/rss/search?hl=en-US&gl=US&ceid=US:en&q=%22General+Dynamics%22+when:14d"}
  - {name: Hanwha Aerospace (Google News), category: company, url: "https://news.google.com/rss/search?hl=en-US&gl=US&ceid=US:en&q=%22Hanwha+Aerospace%22+when:30d"}
  # media
  - {name: Defense News, category: media, url: "https://www.defensenews.com/arc/outboundfeeds/rss/?outputType=xml"}
  - {name: Breaking Defense, category: media, url: "https://breakingdefense.com/feed/"}
  - {name: The War Zone, category: media, url: "https://www.twz.com/feed"}
  - {name: DefenseScoop, category: media, url: "https://defensescoop.com/feed/"}
  - {name: Defense One, category: media, url: "https://www.defenseone.com/rss/all/"}
  - {name: Air & Space Forces Magazine, category: media, url: "https://www.airandspaceforces.com/feed/"}
  - {name: Naval News, category: media, url: "https://www.navalnews.com/feed/"}
  - {name: Army Technology, category: media, url: "https://www.army-technology.com/feed/"}
  - {name: Janes (Google News), category: media, url: "https://news.google.com/rss/search?hl=en-US&gl=US&ceid=US:en&q=site:janes.com+when:30d"}
  # military
  - {name: US DoD (defense.gov), category: military, url: "https://www.defense.gov/DesktopModules/ArticleCS/RSS.ashx?ContentType=1&Site=945&max=10"}
  - {name: US Army, category: military, url: "https://www.army.mil/rss/static/1.xml"}
  - {name: US Navy, category: military, url: "https://www.navy.mil/DesktopModules/ArticleCS/RSS.ashx?ContentType=1&Site=1067&max=10"}
  - {name: US Air Force, category: military, url: "https://www.af.mil/DesktopModules/ArticleCS/RSS.ashx?ContentType=1&Site=1&max=10"}
  - {name: UK MoD (gov.uk), category: military, url: "https://www.gov.uk/government/organisations/ministry-of-defence.atom"}
  # academic
  - {name: arXiv (military/defense), category: academic, url: "https://export.arxiv.org/api/query?search_query=abs:%22military%22+OR+abs:%22defense+industry%22&sortBy=submittedDate&sortOrder=descending&max_results=50"}
  - {name: War on the Rocks, category: academic, url: "https://warontherocks.com/feed/"}
  - {name: CSIS, category: academic, url: "https://www.csis.org/rss.xml"}
  - {name: RAND, category: academic, url: "https://www.rand.org/news.xml"}
